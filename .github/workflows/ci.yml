name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - run: PYTHONPATH=src python -m debark --help

  lint:
    name: Python and shell lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install ruff
      - run: ruff check src tests
      - run: ruff format --check tests
      - run: bash -n install.sh completions/debark.bash
      - run: sudo apt-get update && sudo apt-get install --yes shellcheck
      - run: shellcheck install.sh completions/debark.bash

  coverage:
    name: Coverage report
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install coverage
      - run: coverage run --branch --source=debark -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - run: coverage report
      - run: coverage xml
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: error

  arch-rolling:
    name: Arch rolling compatibility
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Test against current Arch Linux
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            archlinux:latest \
            bash -lc 'pacman -Syu --noconfirm --needed python && \
              PYTHONPATH=src python -m unittest discover -s tests -v && \
              PYTHONPATH=src python -m debark --help'
